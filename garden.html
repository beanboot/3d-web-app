<!doctype html>
<html lang="en">
	<head>
		<title>3D Garden</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
				}
			}
		</script>
	</head>
	<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden">
		<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
			<div class="container-fluid">
				<a class="navbar-brand" href="index.html">3D Garden Web App</a>
				<button
					class="navbar-toggler"
					type="button"
					data-bs-toggle="collapse"
					data-bs-target="#collapsibleNavbar"
				>
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="collapsibleNavbar">
					<ul class="navbar-nav">
						<li class="nav-item"><a class="nav-link" href="#">About</a></li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="container-fluid flex-grow-1 d-flex flex-column py-2" style="overflow: hidden">
			<div
				id="scene-container"
				class="flex-grow-1 mx-auto w-100"
				style="border: 3px solid #4a7c3f; border-radius: 8px; overflow: hidden"
			></div>

			<div class="d-flex gap-2 justify-content-center align-items-center py-2">
				<button id="reset-btn" class="btn btn-success btn-sm">Reset Camera</button>
				<button id="time-btn" class="btn btn-success btn-sm">Flip Time</button>
				<button id="water-btn" class="btn btn-success btn-sm">Water Plant</button>
				<button id="wireframe-btn" class="btn btn-success btn-sm">Wireframe</button>
				<div style="width: 150px">
					<label style="color: green; font-size: 0.8rem">Water Level</label>
					<div
						style="background: #333; border-radius: 8px; height: 12px; overflow: hidden"
					>
						<div
							id="water-bar"
							style="
								background: #4488ff;
								height: 100%;
								width: 100%;
								transition: width 0.1s;
							"
						></div>
					</div>
				</div>
			</div>
		</div>

		<script type="module" src="main.js"></script>
	</body>
</html>
